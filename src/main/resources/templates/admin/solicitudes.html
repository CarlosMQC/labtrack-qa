<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Solicitudes pendientes')}"><title>LabTrack - Solicitudes</title></head>
<body>
<header th:replace="~{fragments :: nav('solicitudes')}"></header>
<main class="contenido">
    <div class="encabezado">
        <div>
            <h1 id="titulo-solicitudes">Solicitudes pendientes</h1>
            <p>Revisa las reservas solicitadas por los estudiantes. Para rechazar una solicitud debes indicar el motivo.</p>
        </div>
        <span class="badge badge-pendiente" th:text="${#lists.size(solicitudes)} + ' pendiente(s)'">0 pendiente(s)</span>
    </div>

    <div id="mensaje-exito" class="alerta alerta-exito" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div id="mensaje-error" class="alerta alerta-error" th:if="${mensajeError}" th:text="${mensajeError}"></div>

    <section class="tarjeta" th:if="${#lists.isEmpty(solicitudes)}">
        <div class="vacio">
            <svg th:replace="~{fragments :: icono-vacio}"></svg>
            <p id="mensaje-vacio">No hay solicitudes pendientes.</p>
        </div>
    </section>

    <section class="tabla-contenedor" th:unless="${#lists.isEmpty(solicitudes)}">
        <table id="tabla-solicitudes" class="tabla">
            <thead>
            <tr><th>Nombre del estudiante</th><th>Equipo</th><th>Fecha/Hora solicitada</th><th>Acciones</th></tr>
            </thead>
            <tbody>
            <tr class="fila-solicitud" th:each="s : ${solicitudes}" th:id="'solicitud-' + ${s.id}">
                <td>
                    <span class="principal" th:text="${s.usuario.nombre}">Estudiante</span>
                    <span class="secundario codigo" th:text="${s.usuario.codigo}">N00000000</span>
                </td>
                <td>
                    <span class="principal" th:text="${s.equipo.nombre}">Equipo</span>
                    <span class="secundario codigo" th:text="${s.equipo.codigo}">EQ-000</span>
                </td>
                <td>
                    <span class="principal" th:text="${#temporals.format(s.fecha, 'dd/MM/yyyy')}">Fecha</span>
                    <span class="secundario" th:text="${#temporals.format(s.horaInicio, 'HH:mm') + ' - ' + #temporals.format(s.horaFin, 'HH:mm')}">Horario</span>
                </td>
                <td class="acciones">
                    <form method="post" th:action="@{/admin/solicitudes/{id}/aprobar(id=${s.id})}">
                        <button type="submit" class="boton btn-aprobar" th:id="'aprobar-' + ${s.id}">Aprobar</button>
                    </form>
                    <form method="post" th:action="@{/admin/solicitudes/{id}/rechazar(id=${s.id})}" class="form-rechazo" novalidate>
                        <label for="motivo" th:for="'motivo-' + ${s.id}" hidden>Motivo del rechazo</label>
                        <input id="motivo" type="text" name="motivo" th:id="'motivo-' + ${s.id}" placeholder="Motivo del rechazo">
                        <button type="submit" class="boton btn-rechazar" th:id="'rechazar-' + ${s.id}">Rechazar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<footer th:replace="~{fragments :: pie}"></footer>
</body>
</html>
